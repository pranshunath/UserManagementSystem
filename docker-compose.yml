services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 16 Relational Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: usermanagement-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: usermanagement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usermanagement"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - usermanagement-network

  # -------------------------------------------------------------
  # 2. Redis 7 High-Speed In-Memory Cache
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: usermanagement-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - usermanagement-network

  # -------------------------------------------------------------
  # 3. Internal gRPC User Management Microservice
  # -------------------------------------------------------------
  user-service:
    build:
      context: .
      dockerfile: cmd/user-service/Dockerfile
    container_name: usermanagement-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: usermanagement
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      GRPC_PORT: "50051"
      JWT_SECRET: "super_secret_jwt_key_change_me_in_production"
    expose:
      - "50051"
    networks:
      - usermanagement-network

  # -------------------------------------------------------------
  # 4. REST API Gateway (Gin Reverse Proxy)
  # -------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    container_name: usermanagement-api-gateway
    restart: unless-stopped
    depends_on:
      - user-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      GRPC_TARGET: user-service:50051
      JWT_SECRET: "super_secret_jwt_key_change_me_in_production"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - usermanagement-network

  # -------------------------------------------------------------
  # 5. Production Web Frontend (React + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: usermanagement-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - usermanagement-network

volumes:
  postgres_data:
  redis_data:

networks:
  usermanagement-network:
    driver: bridge
