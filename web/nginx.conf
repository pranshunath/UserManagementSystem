server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root directory containing production static assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression for fast delivery of web assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Modern Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse Proxy: Route /api/ to the Go API Gateway (:8080)
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy: Route /health to API Gateway health endpoint
    location /health {
        proxy_pass http://api-gateway:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Single Page Application (SPA) routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control for immutable static assets (hashed JS, CSS, images)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Disable access logs for robots.txt and favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
