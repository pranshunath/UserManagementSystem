syntax = "proto3";

package usermanagement.v1;

option go_package = "usermanagementsystem/proto/v1;v1";

// ==========================================
// Domain Entities
// ==========================================

message Department {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

message Role {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  optional int32 department_id = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
  optional Department department = 8;
  repeated Role roles = 9;
}

// ==========================================
// User Service Messages
// ==========================================

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  optional int32 department_id = 4;
  repeated int32 role_ids = 5;
  string status = 6;
}

message GetUserRequest {
  int32 id = 1;
}

message UserResponse {
  User user = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
  optional int32 department_id = 4;
  optional int32 role_id = 5;
  string status = 6;
  string sort_by = 7;
  string sort_order = 8;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
}

message UpdateUserRequest {
  int32 id = 1;
  string name = 2;
  string email = 3;
  optional int32 department_id = 4;
  repeated int32 role_ids = 5;
  string status = 6;
}

message DeleteUserRequest {
  int32 id = 1;
}

message DeleteUserResponse {
  bool success = 1;
  string message = 2;
}

// ==========================================
// Department Service Messages
// ==========================================

message CreateDepartmentRequest {
  string name = 1;
  string description = 2;
}

message GetDepartmentRequest {
  int32 id = 1;
}

message DepartmentResponse {
  Department department = 1;
}

message ListDepartmentsRequest {}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}

message UpdateDepartmentRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

message DeleteDepartmentRequest {
  int32 id = 1;
}

message DeleteDepartmentResponse {
  bool success = 1;
  string message = 2;
}

// ==========================================
// Role Service Messages
// ==========================================

message CreateRoleRequest {
  string name = 1;
  string description = 2;
}

message GetRoleRequest {
  int32 id = 1;
}

message RoleResponse {
  Role role = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message UpdateRoleRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

message DeleteRoleRequest {
  int32 id = 1;
}

message DeleteRoleResponse {
  bool success = 1;
  string message = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
  repeated string roles = 3;
}

// ==========================================
// gRPC Services
// ==========================================

service UserService {
  rpc RegisterUser(CreateUserRequest) returns (UserResponse);
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

service DepartmentService {
  rpc CreateDepartment(CreateDepartmentRequest) returns (DepartmentResponse);
  rpc GetDepartment(GetDepartmentRequest) returns (DepartmentResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (DepartmentResponse);
  rpc DeleteDepartment(DeleteDepartmentRequest) returns (DeleteDepartmentResponse);
}

service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc GetRole(GetRoleRequest) returns (RoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
}
